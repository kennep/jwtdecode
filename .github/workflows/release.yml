name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: jwtdecode_linux_amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: jwtdecode_windows_amd64.exe
            ext: .exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: jwtdecode_macos_amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: jwtdecode_macos_arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml
          rm Cargo.toml.bak
          echo "Set Cargo.toml version to $VERSION"
          grep '^version' Cargo.toml

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/jwtdecode${{ matrix.ext }}"
          if [ "${{ runner.os }}" != "Windows" ]; then
            strip "$BIN"
          fi
          mkdir -p dist
          cp "$BIN" "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  upload:
    name: Upload release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
